    <!-- Three.js 2D Animated Blueprint & Gears -->
    <script>
        const initThreeJS = () => {
            const container = document.getElementById('three-canvas-container');
            const scene = new THREE.Scene();

            const aspect = window.innerWidth / window.innerHeight;
            const camera = new THREE.OrthographicCamera(-aspect * 10, aspect * 10, 10, -10, 0.1, 100);
            camera.position.z = 10;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 1. Animated Blueprint Grid
            const gridMaterial = new THREE.LineBasicMaterial({ color: '#1e3a8a', transparent: true, opacity: 0.25 });
            const gridGroup = new THREE.Group();
            const gridSize = 40;
            const step = 1;

            for (let i = -gridSize; i <= gridSize; i += step) {
                gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i, -gridSize, 0), new THREE.Vector3(i, gridSize, 0)]), gridMaterial));
                gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-gridSize, i, 0), new THREE.Vector3(gridSize, i, 0)]), gridMaterial));
            }
            scene.add(gridGroup);

            // 2. Generate 2D Mechanical Gears
            const createGear = (radius, teeth, innerRadius, color, opacity) => {
                const points = [];
                for(let i=0; i<=teeth * 2; i++) {
                    const angle = (i / (teeth * 2)) * Math.PI * 2;
                    const r = i % 2 === 0 ? radius : innerRadius;
                    points.push(new THREE.Vector3(Math.cos(angle)*r, Math.sin(angle)*r, 0));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
                return new THREE.LineLoop(geometry, material);
            };

            const gearSys = new THREE.Group();
            
            // Large Gear
            const gear1 = createGear(4, 24, 3.5, '#38bdf8', 0.15);
            gear1.position.set(-6, -2, 0);
            
            // Small intersecting Gear
            const gear2 = createGear(2.2, 12, 1.8, '#818cf8', 0.2);
            gear2.position.set(-0.3, 1.5, 0);

            // Tech Circle overlay
            const circleGeo = new THREE.CircleGeometry(1.5, 32);
            const edges = new THREE.EdgesGeometry(circleGeo);
            const circleLine = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: '#38bdf8', transparent:true, opacity:0.1 }));
            circleLine.position.set(5, -4, 0);

            gearSys.add(gear1);
            gearSys.add(gear2);
            gearSys.add(circleLine);
            scene.add(gearSys);

            // Animation Loop
            const animate = () => {
                requestAnimationFrame(animate);
                
                // Grid Panning
                gridGroup.position.x = (gridGroup.position.x - 0.003) % step;
                gridGroup.position.y = (gridGroup.position.y - 0.003) % step;
                
                // Gear Rotation
                gear1.rotation.z -= 0.002;
                gear2.rotation.z += 0.0036; // Ratio based speed
                circleLine.rotation.z += 0.005;

                renderer.render(scene, camera);
            };

            animate();

            // Handle Resize
            window.addEventListener('resize', () => {
                const aspect = window.innerWidth / window.innerHeight;
                camera.left = -aspect * 10;
                camera.right = aspect * 10;
                camera.top = 10;
                camera.bottom = -10;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        initThreeJS();
    </script>
