<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Wamiq Ajmal — Mechanical Engineering Technology portfolio featuring CAD engineering, mechanical assemblies, industrial mechanisms, precision components and technical documentation." />
  <meta name="theme-color" content="#050b16" />
  <title>Wamiq Ajmal | Mechanical Engineering & CAD Portfolio</title>

  <!-- Keep the same repository locations and existing assets. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #040812;
      --bg-2: #07101e;
      --panel: rgba(10, 18, 32, .78);
      --panel-strong: rgba(8, 15, 28, .92);
      --line: rgba(104, 153, 214, .20);
      --line-strong: rgba(83, 172, 255, .38);
      --text: #f7fbff;
      --muted: #9eb0c5;
      --cyan: #55d7ff;
      --blue: #5d8cff;
      --violet: #9a7cff;
      --success: #5fe0a1;
      --shadow: 0 24px 70px rgba(0,0,0,.34);
      --radius: 22px;
      --mono: "JetBrains Mono", monospace;
      --sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(73, 156, 255, .10), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(143, 104, 255, .10), transparent 34%),
        linear-gradient(145deg, var(--bg), var(--bg-2));
      font-family: var(--sans);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    button, a { -webkit-tap-highlight-color: transparent; }

    #three-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: .75;
    }

    #app {
      position: relative;
      z-index: 2;
      width: min(1440px, calc(100% - 34px));
      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .topbar {
      position: sticky;
      top: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 14px;
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(5, 11, 22, .80);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      color: var(--cyan);
      font-family: var(--mono);
      font-weight: 600;
      background: linear-gradient(145deg, rgba(85,215,255,.13), rgba(93,140,255,.08));
      box-shadow: 0 0 24px rgba(85,215,255,.10);
    }

    .brand-text strong {
      display: block;
      font-size: .96rem;
      line-height: 1.1;
      white-space: nowrap;
    }

    .brand-text span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .68rem;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav a {
      padding: 9px 12px;
      border-radius: 10px;
      color: var(--muted);
      font-size: .86rem;
      font-weight: 600;
      transition: .22s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--text);
      background: rgba(85,215,255,.08);
      box-shadow: inset 0 0 0 1px rgba(85,215,255,.10);
    }

    .nav .cv-nav {
      color: #06101a;
      background: linear-gradient(135deg, var(--cyan), #8be7ff);
      font-weight: 800;
    }

    .nav .cv-nav:hover {
      color: #06101a;
      background: linear-gradient(135deg, #81e4ff, #b8f1ff);
    }

    .mobile-menu {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.03);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 92px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(11,20,35,.88), rgba(5,11,22,.78));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar-inner { padding: 24px; }

    .profile-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
    }

    .profile-orbit,
    .profile-orbit::after {
      position: absolute;
      inset: -8px;
      border: 1px dashed rgba(85,215,255,.45);
      border-radius: 50%;
      content: "";
    }

    .profile-orbit { animation: spin 13s linear infinite; }
    .profile-orbit::after {
      inset: 12px;
      border-color: rgba(154,124,255,.35);
      animation: spinReverse 9s linear infinite;
    }

    .profile {
      position: relative;
      width: 132px;
      height: 132px;
      padding: 5px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(85,215,255,.82);
      background: #081221;
      box-shadow: 0 0 36px rgba(85,215,255,.18);
      z-index: 2;
    }

    .identity {
      text-align: center;
    }

    .identity h1 {
      margin: 0;
      font-size: 1.55rem;
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    .identity .role {
      margin: 7px 0 0;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: .75rem;
      line-height: 1.5;
    }

    .identity .meta {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      padding: 7px 10px;
      border: 1px solid rgba(95,224,161,.22);
      border-radius: 999px;
      background: rgba(95,224,161,.06);
      color: #b8f5d7;
      font-family: var(--mono);
      font-size: .67rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 12px rgba(95,224,161,.65);
    }

    .quick-links {
      display: grid;
      gap: 8px;
      margin-top: 22px;
    }

    .quick-links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255,255,255,.018);
      transition: .22s ease;
      font-size: .82rem;
    }

    .quick-links a:hover {
      color: var(--text);
      border-color: var(--line);
      background: rgba(85,215,255,.05);
      transform: translateX(2px);
    }

    .quick-links span:last-child {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: .68rem;
    }

    .sidebar-footer {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--line);
      color: #7f92a8;
      font-family: var(--mono);
      font-size: .65rem;
      line-height: 1.7;
    }

    .main {
      min-width: 0;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 420px;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, .8fr);
      gap: 26px;
      align-items: center;
      padding: clamp(26px, 5vw, 58px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(11,22,40,.88), rgba(7,13,24,.74)),
        radial-gradient(circle at 83% 32%, rgba(85,215,255,.10), transparent 30%);
      box-shadow: var(--shadow);
    }

    .hero::before {
      position: absolute;
      width: 280px;
      height: 280px;
      right: -100px;
      top: -120px;
      border-radius: 50%;
      border: 1px solid rgba(85,215,255,.14);
      box-shadow:
        0 0 0 32px rgba(85,215,255,.025),
        0 0 0 64px rgba(85,215,255,.018);
      content: "";
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #b8d9f6;
      background: rgba(255,255,255,.025);
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .02em;
    }

    .eyebrow i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(85,215,255,.7);
    }

    .hero h2 {
      margin: 18px 0 14px;
      max-width: 760px;
      font-size: clamp(2.3rem, 5.4vw, 5.2rem);
      line-height: .98;
      letter-spacing: -.065em;
    }

    .hero h2 span {
      background: linear-gradient(110deg, #fff 5%, #b5edff 46%, #a999ff 95%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 720px;
      margin: 0;
      color: #a9bad0;
      font-size: 1.03rem;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
      color: var(--text);
      font-size: .85rem;
      font-weight: 700;
      transition: .22s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      background: rgba(85,215,255,.07);
    }

    .btn-primary {
      color: #04111c;
      border-color: transparent;
      background: linear-gradient(135deg, var(--cyan), #92ebff);
      box-shadow: 0 10px 28px rgba(85,215,255,.12);
    }

    .btn-primary:hover {
      color: #04111c;
      background: linear-gradient(135deg, #76e2ff, #c1f5ff);
    }

    .hero-console {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(2,7,14,.72);
      box-shadow: inset 0 0 40px rgba(85,215,255,.025);
      overflow: hidden;
    }

    .console-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.02);
    }

    .console-head i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #526174;
    }

    .console-head span {
      margin-left: auto;
      color: #72869d;
      font-family: var(--mono);
      font-size: .63rem;
    }

    .console-body {
      padding: 17px;
      font-family: var(--mono);
      font-size: .72rem;
      line-height: 1.85;
    }

    .console-body .prompt { color: var(--cyan); }
    .console-body .value { color: #b7c7d9; }
    .console-body .accent { color: var(--violet); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .stat {
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(8,15,28,.76);
      box-shadow: var(--shadow);
    }

    .stat .n {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .stat .l {
      margin-top: 4px;
      color: var(--muted);
      font-size: .72rem;
    }

    .section {
      margin-top: 18px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(10,18,32,.80), rgba(6,12,23,.72));
      box-shadow: var(--shadow);
      scroll-margin-top: 96px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .section-kicker {
      margin: 0 0 7px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .section h3 {
      margin: 0;
      font-size: clamp(1.45rem, 2vw, 2rem);
      letter-spacing: -.04em;
    }

    .section-note {
      max-width: 420px;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.6;
      text-align: right;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 12px;
    }

    .timeline::before {
      position: absolute;
      left: 11px;
      top: 10px;
      bottom: 10px;
      width: 1px;
      background: linear-gradient(var(--line-strong), transparent);
      content: "";
    }

    .job {
      position: relative;
      display: grid;
      grid-template-columns: 26px minmax(0,1fr);
      gap: 14px;
    }

    .job-dot {
      position: relative;
      width: 23px;
      height: 23px;
      margin-top: 4px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: #071322;
      z-index: 1;
    }

    .job-dot::after {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(85,215,255,.55);
      content
