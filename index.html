    <script>
        const initThreeJS = () => {
            const container = document.getElementById('three-canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#060b19');

            // 2D Orthographic Camera for flat technical look
            const aspect = window.innerWidth / window.innerHeight;
            const camera = new THREE.OrthographicCamera(-aspect * 10, aspect * 10, 10, -10, 0.1, 100);
            camera.position.z = 10;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Create Blueprint Grid
            const gridMaterial = new THREE.LineBasicMaterial({ color: '#1e3a8a', transparent: true, opacity: 0.4 });
            const gridGroup = new THREE.Group();

            const gridSize = 40;
            const step = 1;

            for (let i = -gridSize; i <= gridSize; i += step) {
                // Verticals
                let vGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i, -gridSize, 0), new THREE.Vector3(i, gridSize, 0)]);
                gridGroup.add(new THREE.Line(vGeo, gridMaterial));
                // Horizontals
                let hGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-gridSize, i, 0), new THREE.Vector3(gridSize, i, 0)]);
                gridGroup.add(new THREE.Line(hGeo, gridMaterial));
            }
            scene.add(gridGroup);

            // Animation Loop (Slow panning to simulate active drafting board)
            const animate = () => {
                requestAnimationFrame(animate);
                gridGroup.position.x = (gridGroup.position.x - 0.005) % step;
                gridGroup.position.y = (gridGroup.position.y - 0.005) % step;
                renderer.render(scene, camera);
            };

            animate();

            // Handle Resize
            window.addEventListener('resize', () => {
                const aspect = window.innerWidth / window.innerHeight;
                camera.left = -aspect * 10;
                camera.right = aspect * 10;
                camera.top = 10;
                camera.bottom = -10;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        initThreeJS();
    </script>
