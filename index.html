<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wamiq Ajmal | Interactive Engineering Terminal</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Three.js for 2D Canvas Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Google Fonts for Technical Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #020617;
            --panel-bg: rgba(10, 15, 30, 0.65);
            --border-color: #1e3a8a;
            --border-highlight: #60a5fa;
            --accent-main: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.6);
            --accent-secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-mono: 'Share Tech Mono', monospace;
            --font-headers: 'Rajdhani', sans-serif;
            --font-sans: system-ui, -apple-system, sans-serif;
        }

        /* Custom UI Cursor */
        * { cursor: crosshair !important; box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: var(--font-sans); overflow: hidden;
        }

        /* ThreeJS Background */
        #three-canvas-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; background: radial-gradient(circle at center, #061026 0%, #02040a 100%);
        }

        /* React App Container */
        #root {
            height: 100vh; display: flex; flex-direction: column;
            padding: 2vw; pointer-events: none; /* Let clicks pass to background if empty */
        }
        
        .interactive-layer { pointer-events: auto; } /* Re-enable clicks for UI */

        .app-container {
            display: flex; flex-direction: row; height: 100%;
            max-width: 1500px; margin: 0 auto; width: 100%; gap: 30px;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 300px; background: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 30px; display: flex; flex-direction: column;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            flex-shrink: 0; position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(30, 58, 138, 0.3), 0 10px 40px rgba(0,0,0,0.8);
        }

        /* Scanning Line Animation for Sidebar */
        .sidebar::after {
            content: ''; position: absolute; top: -50%; left: 0; right: 0; height: 2px;
            background: var(--accent-main); box-shadow: 0 0 10px var(--accent-main);
            animation: scan 6s linear infinite; opacity: 0.5; pointer-events: none;
        }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

        /* Profile Picture Component */
        .profile-img-container { text-align: center; margin-bottom: 25px; position: relative; display: inline-block; width: 100%; }
        
        /* Rotating Outer Ring for Profile */
        .profile-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150px; height: 150px; border-radius: 50%;
            border: 2px dashed var(--accent-secondary); animation: rotateRing 10s linear infinite; pointer-events: none;
        }
        @keyframes rotateRing { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .profile-img {
            width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent-main);
            box-shadow: 0 0 25px var(--accent-glow), inset 0 0 15px var(--accent-glow);
            background-color: #0f172a; padding: 5px; position: relative; z-index: 2;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        .profile-img:hover { transform: scale(1.1) rotate(5deg); border-color: #fff; box-shadow: 0 0 35px var(--accent-main); }

        .profile-header h1 {
            font-family: var(--font-headers); font-size: 2.4rem; color: var(--text-main);
            margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 2px;
            text-align: center; text-shadow: 0 0 15px var(--accent-glow);
        }

        .profile-header p {
            font-size: 0.85rem; color: var(--accent-main); margin-bottom: 25px;
            line-height: 1.5; text-align: center; font-family: var(--font-mono);
            border-bottom: 1px dashed var(--border-color); padding-bottom: 15px;
        }

        .nav-btn {
            background: transparent; border: 1px solid transparent; border-bottom: 1px solid rgba(30, 58, 138, 0.3);
            color: var(--text-main); text-align: left; padding: 15px;
            cursor: pointer; font-family: var(--font-mono); font-size: 1rem;
            transition: all 0.3s ease; position: relative; overflow: hidden;
            display: flex; align-items: center; text-transform: uppercase; letter-spacing: 1px;
        }
        .nav-btn::before {
            content: '>'; position: absolute; left: -20px; color: var(--accent-main);
            transition: left 0.3s ease; opacity: 0; font-weight: bold;
        }
        .nav-btn:hover { background: rgba(56, 189, 248, 0.1); padding-left: 25px; color: var(--accent-main); }
        .nav-btn:hover::before { left: 10px; opacity: 1; }
        .nav-btn.active {
            background: rgba(30, 58, 138, 0.4); border-left: 4px solid var(--accent-main);
            color: #fff; padding-left: 25px; font-weight: bold; text-shadow: 0 0 8px var(--accent-main);
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1; background: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 40px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            overflow-y: auto; box-shadow: inset 0 0 30px rgba(30, 58, 138, 0.2), 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: var(--accent-main); }

        .section-title {
            font-family: var(--font-headers); color: var(--text-main); text-transform: uppercase;
            border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 0;
            font-size: 2rem; letter-spacing: 2px; display: flex; align-items: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .section-title span { color: var(--accent-main); margin-right: 15px; font-family: var(--font-mono); font-size: 1.5rem; }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px; margin-top: 25px;
        }

        /* Interactive Cards */
        .card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7), rgba(2, 6, 23, 0.9));
            border: 1px solid var(--border-color); padding: 25px; border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; overflow: hidden; cursor: pointer;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .card:hover {
            transform: translateY(-5px) scale(1.02); border-color: var(--accent-main);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.2);
        }
        .card:hover::before { opacity: 1; }
        .card h3 {
            margin: 0 0 10px 0; color: #fff; font-size: 1.4rem; font-family: var(--font-headers);
            letter-spacing: 1px; transition: color 0.3s;
        }
        .card:hover h3 { color: var(--accent-main); }
        .card-meta { font-size: 0.85rem; color: var(--accent-secondary); margin-bottom: 15px; font-family: var(--font-mono); }

        .tech-tag {
            display: inline-block; background: rgba(56, 189, 248, 0.05);
            border: 1px solid var(--accent-secondary); color: var(--accent-main);
            padding: 5px 12px; font-size: 0.85rem; border-radius: 4px; margin: 4px;
            font-family: var(--font-mono); transition: all 0.2s;
        }
        .tech-tag:hover { background: var(--accent-main); color: var(--bg-color); box-shadow: 0 0 10px var(--accent-main); }

        /* Modal / HUD Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; animation: fadeInModal 0.3s forwards; pointer-events: auto;
        }
        @keyframes fadeInModal { to { opacity: 1; } }
        
        .modal-content {
            background: #020617; border: 2px solid var(--accent-main);
            width: 90%; max-width: 700px; padding: 40px; border-radius: 12px;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.3), inset 0 0 20px rgba(56, 189, 248, 0.2);
            position: relative; transform: scale(0.9); animation: popModal 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popModal { to { transform: scale(1); } }
        
        .modal-close {
            position: absolute; top: 20px; right: 20px; background: transparent;
            border: 1px solid var(--accent-main); color: var(--accent-main);
            width: 35px; height: 35px; font-family: var(--font-mono); font-size: 1.2rem;
            cursor: pointer; transition: all 0.2s; border-radius: 4px;
        }
        .modal-close:hover { background: var(--accent-main); color: var(--bg-color); }

        /* Animation Classes */
        .stagger-in { opacity: 0; animation: slideUpFade 0.5s forwards ease-out; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Terminal Typing Effect */
        .typing-text { border-right: 2px solid var(--accent-main); white-space: pre-wrap; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { border-color: transparent; } }

        a { color: var(--accent-main); text-decoration: none; position: relative; }
        a::after { content: ''; position: absolute; width: 100%; transform: scaleX(0); height: 1px; bottom: -2px; left: 0; background-color: var(--accent-main); transform-origin: bottom right; transition: transform 0.3s ease-out; }
        a:hover::after { transform: scaleX(1); transform-origin: bottom left; }

        @media (max-width: 950px) {
            .app-container { flex-direction: column; gap: 20px; padding: 10px; }
            .sidebar { width: 100%; flex-direction: column; padding: 20px; }
            .profile-img { width: 100px; height: 100px; }
            .profile-ring { width: 120px; height: 120px; }
            .nav-btn { text-align: center; justify-content: center; }
            .nav-btn::before { display: none; }
            .nav-btn:hover { padding-left: 15px; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Background Layer (Three.js) -->
    <div id="three-canvas-container"></div>

    <!-- UI Layer (React) -->

    <!-- Three.js Interactive 2D Blueprint Script -->
    <script>
        const initThreeJS = () => {
            const container = document.getElementById('three-canvas-container');
            const scene = new THREE.Scene();

            const aspect = window.innerWidth / window.innerHeight;
            const camera = new THREE.OrthographicCamera(-aspect * 10, aspect * 10, 10, -10, 0.1, 100);
            camera.position.z = 10;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 1. Grid System
            const gridGroup = new THREE.Group();
            const gridMat = new THREE.LineBasicMaterial({ color: '#1e3a8a', transparent: true, opacity: 0.15 });
            for (let i = -50; i <= 50; i += 1.5) {
                gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i, -50, 0), new THREE.Vector3(i, 50, 0)]), gridMat));
                gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-50, i, 0), new THREE.Vector3(50, i, 0)]), gridMat));
            }
            scene.add(gridGroup);

            // 2. Interactive Gear System
            const createGear = (radius, teeth, innerRadius, color, opacity) => {
                const pts = [];
                for(let i=0; i<=teeth * 2; i++) {
                    const a = (i / (teeth * 2)) * Math.PI * 2;
                    const r = i % 2 === 0 ? radius : innerRadius;
                    pts.push(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r, 0));
                }
                return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
            };

            const gearSys = new THREE.Group();
            const gearMain = createGear(5, 32, 4.2, '#38bdf8', 0.2);
            const gearSub = createGear(2.5, 16, 2.0, '#818cf8', 0.25);
            gearMain.position.set(-8, -3, 0);
            gearSub.position.set(-1.8, 1.2, 0);
            gearSys.add(gearMain); gearSys.add(gearSub);
            scene.add(gearSys);

            // 3. Mouse Tracking Crosshair (Interactive)
            const crosshair = new THREE.Group();
            const chMat = new THREE.LineBasicMaterial({ color: '#38bdf8', opacity: 0.5, transparent: true });
            crosshair.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-0.5,0,0), new THREE.Vector3(0.5,0,0)]), chMat));
            crosshair.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-0.5,0), new THREE.Vector3(0,0.5,0)]), chMat));
            scene.add(crosshair);

            // Mouse Interaction Variables
            let targetX = 0; let targetY = 0;
            let mouseX = 0; let mouseY = 0;

            document.addEventListener('mousemove', (e) => {
                // Normalize mouse coordinates for Parallax & Crosshair
                mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                
                // Map to Orthographic space
                targetX = mouseX * aspect * 10;
                targetY = mouseY * 10;
            });

            // Animation Loop
            const clock = new THREE.Clock();
            const animate = () => {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();

                // Parallax shift based on mouse
                gridGroup.position.x += (mouseX * 0.5 - gridGroup.position.x) * 0.05;
                gridGroup.position.y += (mouseY * 0.5 - gridGroup.position.y) * 0.05;

                // Gears Rotation
                gearMain.rotation.z -= 0.5 * delta;
                gearSub.rotation.z += 1.0 * delta; // 2:1 ratio

                // Crosshair Lerp to mouse position
                crosshair.position.x += (targetX - crosshair.position.x) * 0.1;
                crosshair.position.y += (targetY - crosshair.position.y) * 0.1;
                crosshair.rotation.z -= 1.5 * delta; // Spinning crosshair

                renderer.render(scene, camera);
            };
            animate();

            // Resize handler
            window.addEventListener('resize', () => {
                const aspect = window.innerWidth / window.innerHeight;
                camera.left = -aspect * 10; camera.right = aspect * 10;
                camera.top = 10; camera.bottom = -10;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        initThreeJS();
    </script>

    <!-- React Application Component -->

            ]}
        ];

        // --- Interactive Components ---

        // Typing Effect Hook
        const useTypewriter = (text, speed = 20) => {
            const [displayText, setDisplayText] = useState('');
            useEffect(() => {
                let i = 0;
                setDisplayText('');
                const timer = setInterval(() => {
                    if (i < text.length) { setDisplayText(prev => prev + text.charAt(i)); i++; } 
                    else { clearInterval(timer); }
                }, speed);
                return () => clearInterval(timer);
            }, [text]);
            return displayText;
        };

            return (

                        <div style={{color: 'var(--accent-secondary)', fontFamily: 'var(--font-mono)', marginBottom: '20px', fontSize: '1.1rem'}}>

                        <p style={{fontSize: '1.1rem', lineHeight: '1.6', color: '#e2e8f0'}}>{data.desc}</p>
                        
                        <div style={{marginTop: '30px', borderTop: '1px dashed var(--border-color)', paddingTop: '20px'}}>

                            </div>

            return (

                    <div className="typing-text" style={{fontFamily: 'var(--font-mono)', fontSize: '1.15rem', lineHeight: '1.8', color: '#93c5fd', background: 'rgba(0,0,0,0.4)', padding: '20px', borderRadius: '8px', border: '1px solid var(--border-color)'}}>

                            {['SolidWorks (2D/3D)', 'Creo Parametric', 'CNC Operation', 'Precision Machining', 'Metal Fabrication', 'G-code Fundamentals', 'Quality Control', 'MS Office & IT'].map((skill, i) => (
                                <span key={skill} className="tech-tag" style={{animation: `slideUpFade 0.3s forwards ease-out`, animationDelay: `${1.2 + (i*0.1)}s`, opacity: 0}}>
                                    SYS.{skill.replace(/\s+/g, '_').toUpperCase()}

                            ))}
                        </div>

            );

        const Experience = ({ openModal }) => (
